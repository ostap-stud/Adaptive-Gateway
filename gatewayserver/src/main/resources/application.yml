management:
  endpoints:
    web:
      exposure:
        include: gateway, health, info
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

openapi:
  service:
    title: Infrastructure Gateway API specification
    version: 1.0.0
    description: Керує специфікаціями API мікросервісів. Документує внутрішні кінцеві точки системи, що призначені не для реєстрації шлюзом, а для керування ним та моніторингу інфраструктури.

