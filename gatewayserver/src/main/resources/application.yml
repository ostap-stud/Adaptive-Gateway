server:
#  port: 8080
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: volunteer-core
    enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
#    hostname: ${COMPUTERNAME}
    hostname: asf314
 
spring:
  application:
    name: ldubgd-gateway
  cloud:
    gateway:
      routes:
      - id: test-service
        uri: lb://test-service
        predicates:
          - Path=/test/**
        filters:
          - name: Authentication
      - id: auth-service
        uri: lb://auth-service
        predicates:
          - Path=/auth/**
      - id: geoserver
#        uri: http://10.138.10.103:10000/
#        uri: http://10.138.10.102:8080/
        uri: https://geo-info.co.uk/
        predicates:
#          - Method=GET,POST
          - Path=/geoserver/**
      - id: google
        uri: https://www.google.com/
        predicates:
          - Path=/google/**
      - id: notify
        uri: http://10.138.10.103:10000/
        predicates:
          - Path=/notify/{segment}
#          - Method=GET,POST
        filters:
          - SetPath=/{segment}
#          - RewritePath=/notify/?(?<segment>.*), /$\{segment}
#          - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      - id: notificationService
        uri: lb://notification
        predicates:
        - Path=/notification/***
    discovery:
      locator:
        enabled: 'true'
        lower-case-service-id: true

openapi:
  service:
    title: Infrastructure Gateway API specification
    version: 1.0.0
    description: Manages API specification's of microservices. Commonly contains only inner (non-public) endpoints for communication with services.

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: test-service
        url: /test/v3/api-docs
      - name: authentication-service
        url: /auth/v3/api-docs
      - name: gateway-service
        url: /v3/api-docs
