<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Travel Agency</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">Vouchers</a>
                </li>
            </ul>
            <nav class="navbar navbar-light">
                <div class="container-fluid justify-content-start">
                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/sign-in}" class="btn btn-sm btn-outline-success me-4">Sign in</a>
                        <a th:href="@{/sign-up}" class="btn btn-sm btn-outline-secondary">Sign up</a>

                    </th:block>
                    <th:block sec:authorize="isAuthenticated()">
                        <h6 class="me-2"><small>Welcome, <span sec:authentication="name">Username</span>!</small></h6>
                        <form th:action="@{/sign-out}" method="post">
                            <button class="btn btn-sm btn-outline-secondary" type="submit">Sign out</button>
                        </form>
                    </th:block>
                    <button id="theme-toggle-btn" class="btn btn-secondary ms-3" type="button">
                        <i class="bi bi-lightbulb"></i>
                    </button>

                </div>

            </nav>
        </div>
    </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
