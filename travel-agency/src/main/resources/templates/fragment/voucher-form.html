<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:fragment="voucherForm (voucherDTO)" class="container mt-4">
    <h1 class="mb-4" th:text="${voucherDTO.id != null} ? 'Edit Voucher' : 'Create Voucher'">Header</h1>
    <div th:with="action=${voucherDTO.id != null} ? ${#strings.concat('/voucher/', voucherDTO.id)} : '/voucher/'">
        <form th:action="@{${action}}" th:object="${voucherDTO}" method="post">
            <input th:if="${voucherDTO.id}" type="hidden" id="id" name="id" th:value="${voucherDTO.id}">
            <input th:if="${voucherDTO.userId}" type="hidden" id="userId" name="userId" th:value="${voucherDTO.userId}">
            <div th:if="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}">
                <input type="hidden" name="title" th:value="${voucherDTO.title}"/>
                <input type="hidden" name="description" th:value="${voucherDTO.description}"/>
                <input type="hidden" name="price" th:value="${voucherDTO.price}"/>
                <input type="hidden" name="tourType" th:value="${voucherDTO.tourType}"/>
                <input type="hidden" name="transferType" th:value="${voucherDTO.transferType}"/>
                <input type="hidden" name="hotelType" th:value="${voucherDTO.hotelType}"/>
                <input type="hidden" name="arrivalDate" th:value="${voucherDTO.arrivalDate}"/>
                <input type="hidden" name="evictionDate" th:value="${voucherDTO.evictionDate}"/>
            </div>
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input id="title" type="text" class="form-control" th:classappend="${#fields.hasErrors('title') ? 'is-invalid' : ''}" name="title" th:value="${voucherDTO.title}" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}"/>
                <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" id="validationTitleFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input id="description" type="text" class="form-control" th:classappend="${#fields.hasErrors('description') ? 'is-invalid' : ''}" name="description" th:value="${voucherDTO.description}" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}"/>
                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" id="validationDescriptionFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input id="price" type="number" class="form-control" th:classappend="${#fields.hasErrors('price') ? 'is-invalid' : ''}" name="price" th:value="${voucherDTO.price}" min="0" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}" />
                <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" id="validationPriceFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="tourType" class="form-label">Tour Type</label>
                <select id="tourType" class="form-select"  th:classappend="${#fields.hasErrors('tourType') ? 'is-invalid' : ''}" aria-label="Tour Type" name="tourType" th:value="${voucherDTO.tourType}" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}">
                    <option value="">---</option>
                    <option th:each="tourType : ${T(com.epam.finaltask.model.TourType).values()}"
                            th:value="${tourType}" th:text="${tourType}" th:selected="${#strings.equals(tourType, voucherDTO.tourType)}">Tour Type</option>
                </select>
                <div th:if="${#fields.hasErrors('tourType')}" th:errors="*{tourType}" id="validationTourTypeFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="transferType" class="form-label">Transfer Type</label>
                <select id="transferType" class="form-select" th:classappend="${#fields.hasErrors('transferType') ? 'is-invalid' : ''}" aria-label="Transfer Type" name="transferType" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}">
                    <option value="">---</option>
                    <option th:each="transferType : ${T(com.epam.finaltask.model.TransferType).values()}"
                            th:value="${transferType}" th:text="${transferType}" th:selected="${#strings.equals(transferType, voucherDTO.transferType)}">Transfer Type</option>
                </select>
                <div th:if="${#fields.hasErrors('transferType')}" th:errors="*{transferType}" id="validationTransferTypeFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="hotelType" class="form-label">Hotel Type</label>
                <select id="hotelType" class="form-select" th:classappend="${#fields.hasErrors('hotelType') ? 'is-invalid' : ''}" aria-label="Hotel Type" name="hotelType" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}">
                    <option value="">---</option>
                    <option th:each="hotelType : ${T(com.epam.finaltask.model.HotelType).values()}"
                            th:value="${hotelType}" th:text="${hotelType}" th:selected="${#strings.equals(hotelType, voucherDTO.hotelType)}">Hotel Type</option>
                </select>
                <div th:if="${#fields.hasErrors('hotelType')}" th:errors="*{hotelType}" id="validationHotelTypeFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select" th:classappend="${#fields.hasErrors('status') ? 'is-invalid' : ''}" aria-label="Status" name="status">
                    <option value="">---</option>
                    <option th:each="status : ${T(com.epam.finaltask.model.VoucherStatus).values()}"
                            th:value="${status}" th:text="${status}" th:selected="${#strings.equals(status, voucherDTO.status)}">Status Type</option>
                </select>
                <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" id="validationStatusFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="arrivalDate" class="form-label">Arrival</label>
                <input id="arrivalDate" type="date" class="form-control" th:classappend="${#fields.hasErrors('arrivalDate') ? 'is-invalid' : ''}" aria-label="Arrival Date" name="arrivalDate" th:value="${voucherDTO.arrivalDate}" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}"/>
                <div th:if="${#fields.hasErrors('arrivalDate')}" th:errors="*{arrivalDate}" id="validationArrivalFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="evictionDate" class="form-label">Eviction</label>
                <input id="evictionDate" type="date" class="form-control" th:classappend="${#fields.hasErrors('evictionDate') ? 'is-invalid' : ''}" aria-label="Eviction Date" name="evictionDate" th:value="${voucherDTO.evictionDate}" th:disabled="${!#authorization.expression('hasAnyAuthority(''ADMIN_CREATE'', ''ADMIN_UPDATE'')')}"/>
                <div th:if="${#fields.hasErrors('evictionDate')}" th:errors="*{evictionDate}" id="validationEvictionFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <label for="hot" class="form-label">Hot</label>
                <input id="hot" type="checkbox" aria-label="Hot" name="hot" th:checked="${voucherDTO.hot} ? 'checked'"/>
                <div th:if="${#fields.hasErrors('hot')}" th:errors="*{hot}" id="validationHotFeedback" class="invalid-feedback">
                    Validation error message
                </div>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
