<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <!-- Add Bootstrap CSS -->
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/error-alert.css" rel="stylesheet" crossorigin="anonymous">
    <script src="/js/checkTheme.js"></script>
</head>
<body>
    <div th:replace="~{fragment/navbar :: navbar}"></div>
    <div class="container">
        <section class="py-3 py-md-5 min-vh-100 d-flex justify-content-center align-items-center">
            <div class="container">
                <div class="row">
                    <div th:object="${errorResponse}" class="col-12">
                        <div class="text-center">
                            <h2 th:with="code=(${errorResponse.errorCode.toCharArray()})" class="d-flex justify-content-center align-items-center gap-2 mb-4">
                                <span th:text="${code[0]}" class="display-1 fw-bold">4</span>
                                <i class="bi bi-exclamation-circle-fill text-danger display-4"></i>
                                <span th:text="${code[2]}" class="display-1 fw-bold bsb-flip-h">4</span>
                            </h2>
                            <h3 th:text="*{errorHeader}" class="h2 mb-2">Oops! You're lost.</h3>
                            <p th:text="*{errorBody}" class="mb-5">The page you are looking for was not found.</p>
                            <a class="btn bsb-btn-5xl btn-dark rounded-pill px-5 fs-6 m-0" href="javascript:history.back()" role="button">Go Back</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="/js/themeToggle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
