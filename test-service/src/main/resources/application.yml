openapi:
  service:
    title: Test-service API specification
    version: 1.0.0
#    url: https://localhost:8443
    url: https://localhost:8088

spring:
  application:
    name: test-service

server:
  port: 8996

eureka:
  instance:
    metadata-map:
      "[gateway.enabled]": "true"
      "[gateway.openapi-path]": "/${spring.application.name}/v3/api-docs"
      "[gateway.base-path]": "/${spring.application.name}"
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
    path: /${spring.application.name}/v3/api-docs
  swagger-ui:
    enabled: true
    path: /${spring.application.name}/swagger-ui.html




